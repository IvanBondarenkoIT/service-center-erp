{% extends "base.html" %}
{% block title %}{{ t('admin.edit_opening') }} — {{ t('app.name') }}{% endblock %}
{% block content %}
<div class="toolbar">
  <h1>{{ t('admin.edit_opening') }}</h1>
  <a class="btn btn-ghost" href="/cash/entries">{{ t('orders.back') }}</a>
</div>

{% if error %}<p class="error">{{ t(error) }}</p>{% endif %}

<form method="post" action="/cash/openings/{{ opening.id }}/edit" class="card stack">
  <div class="grid-3">
    <div>
      <label>{{ t('cash.center') }}</label>
      <select name="service_center_id" required>
        {% for c in centers %}
        <option value="{{ c.id }}" {% if c.id == opening.service_center_id %}selected{% endif %}>{{ c.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label>{{ t('cash.date') }}</label>
      <input type="date" name="as_of_date" required value="{{ opening.as_of_date.isoformat() }}" />
    </div>
    <div>
      <label>{{ t('cash.amount') }}, {{ t('orders.currency') }}</label>
      <input type="number" step="0.01" name="amount" class="input-mono input-amount" required value="{{ '%.2f'|format(opening.amount) }}" />
    </div>
  </div>
  <label class="check-row">
    <input type="checkbox" name="is_start" value="1" {% if opening.is_start %}checked{% endif %} />
    {{ t('cash.start_hint') }}
  </label>
  <button class="btn btn-login" type="submit">{{ t('orders.save') }}</button>
</form>

<form method="post" action="/cash/openings/{{ opening.id }}/delete" class="card" onsubmit="return confirm('{{ t('admin.delete_confirm') }}')">
  <button class="btn btn-danger" type="submit">{{ t('admin.delete') }}</button>
</form>
{% endblock %}

<body class="min-h-screen flex items-center justify-center font-body-md text-on-surface">
<!-- Login Container -->

<p class="font-label-muted text-label-muted text-on-surface-variant text-center mt-xs">
                «Сервис кофеварок»
            </p>
</header>
<!-- Form Section -->
<form action="#" class="space-y-md" method="POST">
<!-- Login Field -->
<div class="flex flex-col">
<label class="font-label-muted text-label-muted text-on-surface-variant mb-xs" for="login">
                    Логин
                </label>
<input class="h-target-min border border-input-border bg-surface-container-lowest px-md font-body-md text-body-md text-on-surface focus:outline-none focus:border-input-focus focus:ring-0 rounded-none transition-colors" id="login" name="login" required="" type="text"/>
</div>
<!-- Password Field -->
<div class="flex flex-col">
<label class="font-label-muted text-label-muted text-on-surface-variant mb-xs" for="password">
                    Пароль
                </label>
<input class="h-target-min border border-input-border bg-surface-container-lowest px-md font-body-md text-body-md text-on-surface focus:outline-none focus:border-input-focus focus:ring-0 rounded-none transition-colors" id="password" name="password" required="" type="password"/>
</div>
<!-- Submit Button -->
<div class="pt-sm">
<button class="w-full h-target-min bg-primary-container text-on-primary font-label-caps text-label-caps uppercase flex items-center justify-center hover:bg-on-primary-fixed-variant transition-colors rounded-none" type="submit">

</div>
